name: chatapp
description: "Real-Time 1-to-1 E2EE Chat, Voice & Video Calling App with Laravel Reverb & WebRTC"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Networking & HTTP
  dio: ^5.7.0

  # Secure Storage & Persistence
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Environment Config
  flutter_dotenv: ^5.2.1

  # Dependency Injection
  get_it: ^8.0.2

  # Hardware Permissions
  permission_handler: ^11.3.1

  # Cryptography (E2EE: X25519, AES-256-GCM, HKDF)
  cryptography: ^2.7.0

  # Real-time WebSockets (Laravel Reverb / Pusher Protocol)
  pusher_channels_flutter: ^2.2.1

  # WebRTC (P2P Audio & Video Calling)
  flutter_webrtc: ^0.12.4

  # Media Picker & Audio / Document Utilities
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  record: ^5.1.2
  audioplayers: ^6.0.0
  open_filex: ^4.5.0
  intl: ^0.19.0

  # Push Notifications & Native Call Screen
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_callkit_incoming: ^2.0.4+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/

dependency_overrides:
  record_linux: 1.3.1
